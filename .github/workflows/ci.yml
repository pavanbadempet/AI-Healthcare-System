name: AIO Healthcare CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: "dummy_key_for_testing"
      SECRET_KEY: "test_secret_key_for_ci_only"
      TESTING: "true"

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          tests/requirements-test.txt

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install Frontend Dependencies
      working-directory: frontend
      run: bun install

    - name: Lint React Frontend
      working-directory: frontend
      run: bun run lint

    - name: Build React Frontend
      working-directory: frontend
      run: bun run build

    - name: Check agent adapter sync
      run: python scripts/sync_agent_adapters.py --check
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements-test.txt
        pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
        
    - name: Lint Python Code with Ruff
      run: python -m ruff check backend/

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Install Playwright Browsers
      working-directory: frontend
      run: |
        npx playwright install chromium --with-deps


    - name: Generate Placeholder Models
      run: python scripts/generate_placeholder_models.py
        
    - name: Start Backend in Background
      env:
        DATABASE_URL: "sqlite:///healthcare_test.db"
      run: |
        nohup uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &

    - name: Wait for Servers
      run: |
        python scripts/wait_for_server.py http://127.0.0.1:8000 || (echo "Backend failed; log:" && tail -n 100 /tmp/uvicorn.log && exit 1)

    - name: Run Backend Tests (Unit, Integration)
      run: |
        pytest tests/ --ignore=tests/e2e --cov=backend --cov-report=term-missing --run-slow

    - name: Run Frontend Unit Tests
      working-directory: frontend
      run: bun run test

    - name: Run Frontend E2E Playwright Tests
      working-directory: frontend
      run: bun run test:e2e

