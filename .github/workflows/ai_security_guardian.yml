name: "Autonomous AI Security Guardian"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 6 * * *'

jobs:
  security-guardian:
    name: "Automated SAST & Security Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit ruff

      - name: Run Bandit AST Security Scan
        run: |
          bandit -r backend/ -ll -ii --exclude backend/tests,tests || true

      - name: Run Ruff Security & Code Standards Check
        run: |
          ruff check backend/ --select S,ASYNC,B,E,F || true


      - name: Run Pip Audit Dependency Vulnerability Check
        run: |
          pip-audit --desc || true
