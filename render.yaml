services:
  - type: web
    name: aio-health-backend
    env: rust
    plan: free
    buildCommand: cargo build --release --manifest-path rust_gateway/Cargo.toml --bin rust_gateway
    startCommand: cargo run --release --manifest-path rust_gateway/Cargo.toml --bin rust_gateway
    envVars:
      - key: ENV
        value: "production"
      - key: ALLOWED_HOSTS
        value: "aio-health-backend.onrender.com,aio-health-backend-gdzi.onrender.com,127.0.0.1"
      - key: CORS_ORIGINS
        value: "https://ai-healthcare-system.streamlit.app,http://127.0.0.1:3000"
      - key: DATABASE_URL
        value: "sqlite:///./healthcare.db"
