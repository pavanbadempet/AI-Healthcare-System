services:
  - type: web
    name: aio-health-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ALLOWED_HOSTS
        value: "aio-health-backend.onrender.com,aio-health-backend-gdzi.onrender.com,127.0.0.1"
      - key: CORS_ORIGINS
        value: "https://ai-healthcare-system.streamlit.app,http://127.0.0.1:3000"
      - key: DATABASE_URL
        value: "sqlite:///./healthcare.db"
