apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-healthcare-backend
  namespace: healthcare-prod
  labels:
    app: ai-healthcare-backend
    compliance: fda-samd-hipaa
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-healthcare-backend
  template:
    metadata:
      labels:
        app: ai-healthcare-backend
    spec:
      containers:
      - name: backend
        image: ai-healthcare-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: healthcare-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: healthcare-secrets
              key: redis-url
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-healthcare-hpa
  namespace: healthcare-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-healthcare-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
