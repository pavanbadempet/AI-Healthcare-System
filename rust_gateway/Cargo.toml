[package]
name = "rust_gateway"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_gateway_ffi"
crate-type = ["cdylib", "rlib"]

[dependencies]
axum = { version = "0.8.9", features = ["ws", "macros"] }
futures-util = "0.3"
tokio-stream = "0.1"
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-rustls",
    "chrono",
    "sqlite",
    "postgres",
    "macros",
    "migrate",
    "json",
    "uuid"
] }
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors", "fs", "trace", "compression-full"] }
chrono = { version = "0.4", features = ["serde"] }
http-body-util = "0.1.3"
bcrypt = "0.19.2"
dotenvy = "0.15.7"
serde_urlencoded = "0.7.1"
sha2 = "0.10.8"
aes-gcm = "0.10.3"
base64 = "0.22.1"
rand = "0.8.5"
uuid = { version = "1.10", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sysinfo = "0.33.0"
rmp-serde = "1.3.0"
pyo3 = { version = "*", features = ["extension-module"] }
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
rayon = "*"
arc-swap = "*"
rkyv = { version = "*", features = ["validation"] }
mimalloc = "*"
regex = "1.13.1"
ort = { version = "2.0.0-rc.9", features = ["ndarray", "download-binaries", "copy-dylibs"] }
ndarray = "0.16"
thiserror = "2.0"
flate2 = "1.0"

[build-dependencies]
tonic-build = "0.12"
prost-build = "0.13"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 2

